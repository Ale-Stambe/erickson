
<div class="hub-slider-vimeo">

    <div class="hub-slider-vimeo__slide">
        <div class="hub-video-vimeo" data-vimeo-id="123456789">
            <img
                class="hub-video-vimeo__cover"
                alt="Guarda il video"
                loading="lazy"
            >
            <button class="hub-video-vimeo__play" type="button" aria-label="Riproduci il video">
                ▶
            </button>
        </div>
    </div>

</div>

<style>

.hub-slider-vimeo {
    width: 100%;
}

.hub-slider-vimeo .hub-video-vimeo {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #000;
    cursor: pointer;
    border-radius: 12px;
}

.hub-slider-vimeo .hub-video-vimeo__cover {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.hub-slider-vimeo .hub-video-vimeo iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}

.hub-slider-vimeo .hub-video-vimeo__play {
    position: absolute;
    bottom: 15px;
    right: 15px;

    width: 64px;
    height: 64px;

    padding: 0;
    border: 0;
    border-radius: 50%;

    background: rgba(0, 0, 0, 0.75);
    color: #fff;

    font-size: 28px;
    line-height: 64px;
    text-align: center;

    cursor: pointer;
    z-index: 1;
}

.zambotti .hub-slider-vimeo .hub-video-vimeo__play {
    bottom: unset !important;
    right: unset !important;
    left: 15px;
    top: 15px;
}

</style>

<script>
require(['jquery'], function ($) {

    // Recupero automatico copertine Vimeo
    $('.hub-slider-vimeo .hub-video-vimeo').each(function () {

        var container = $(this);
        var videoId = container.attr('data-vimeo-id');
        var videoHash = container.attr('data-vimeo-hash');

        if (!videoId || !/^\d+$/.test(videoId)) {
            return;
        }

        var videoUrl = 'https://vimeo.com/' + videoId;

        if (videoHash) {
            videoUrl += '/' + encodeURIComponent(videoHash);
        }

        $.ajax({
            url: 'https://vimeo.com/api/oembed.json',
            dataType: 'jsonp',
            data: {
                url: videoUrl,
                width: 1280
            },
            success: function (data) {

                if (data.thumbnail_url) {
                    container.find('.hub-video-vimeo__cover')
                        .attr('src', data.thumbnail_url);
                }

            },
            error: function () {
                console.warn(
                    'Impossibile recuperare la copertina Vimeo: ' + videoId
                );
            }
        });

    });

    // Riproduzione Vimeo al clic
    $(document).on(
        'click',
        '.hub-slider-vimeo .hub-video-vimeo__play',
        function () {

            var container = $(this).closest('.hub-video-vimeo');
            var videoId = container.attr('data-vimeo-id');
            var videoHash = container.attr('data-vimeo-hash');

            if (container.hasClass('video-loaded')) {
                return;
            }

            if (!videoId || !/^\d+$/.test(videoId)) {
                return;
            }

            container.addClass('video-loaded');

            var videoSrc =
                'https://player.vimeo.com/video/' + videoId;

            if (videoHash) {
                videoSrc += '?h=' + encodeURIComponent(videoHash)
                    + '&autoplay=1';
            } else {
                videoSrc += '?autoplay=1';
            }

            var iframe = $('<iframe>', {

                src: videoSrc,

                title: 'Video Vimeo',

                allow:
                    'autoplay; fullscreen; picture-in-picture; encrypted-media',

                allowfullscreen: true

            });

            container.empty().append(iframe);

        }
    );

});
</script>
